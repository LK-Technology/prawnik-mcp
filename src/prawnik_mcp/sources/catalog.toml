# Source catalog: one entry per legal data source.
#
# maturity: stable | beta | experimental | research (not implemented; listed so users know the gap)
# rate_per_s: maximum request rate per host we allow ourselves (polite default, never above source limits)
# id_prefix: prefix of document ids produced by the connector (used to attribute stored records to a source)

[sources.eli]
name = "ELI API — Dziennik Ustaw (Chancellery of the Sejm)"
publisher = "Kancelaria Sejmu RP – API ELI (Dziennik Ustaw)"
base_url = "https://api.sejm.gov.pl/eli"
hosts = ["api.sejm.gov.pl"]
rate_per_s = 1.0
kinds = ["statute"]
id_prefix = "eli:"
maturity = "beta"
terms = "Legal acts are not subject to copyright (art. 4 pt 2 of the Polish Copyright Act). No separate API terms found — unverified."
terms_url = "https://api.sejm.gov.pl/eli_pl.html"
terms_checked_at = "2026-09-26"
attribution = "Źródło: Dziennik Ustaw RP, API ELI Kancelarii Sejmu (api.sejm.gov.pl)"
known_gaps = [
  "Only the latest consolidated text (TJ) per act; no history of wordings (valid_from/valid_to not set).",
  "A TJ may include amendments entering into force after its state-of-law date (pending_changes, tracked per act, not per article).",
  "Transitional provisions not included in the TJ are quoted in excluded_provisions.",
  "Text extracted from PDF: superscripts restored heuristically; occasional spacing artefacts inside words.",
]

[sources.eli.defaults]
acts = { "DU/1964/93" = "Kodeks cywilny", "DU/2014/827" = "ustawa o prawach konsumenta" }

[sources.eli.aliases]
"kc" = "eli:DU/1964/93"
"k.c." = "eli:DU/1964/93"
"kodeks cywilny" = "eli:DU/1964/93"
"kodeksu cywilnego" = "eli:DU/1964/93"
"upk" = "eli:DU/2014/827"
"u.p.k." = "eli:DU/2014/827"
"ustawa o prawach konsumenta" = "eli:DU/2014/827"
"ustawy o prawach konsumenta" = "eli:DU/2014/827"
"prawach konsumenta" = "eli:DU/2014/827"

[sources.saos]
name = "SAOS — court judgments (ICM, University of Warsaw)"
publisher = "SAOS – System Analizy Orzeczeń Sądowych (ICM UW); judgments come from court portals"
base_url = "https://www.saos.org.pl/api"
hosts = ["www.saos.org.pl"]
rate_per_s = 1.0
kinds = ["judgment"]
id_prefix = "saos:"
maturity = "beta"
terms = "Judgments are official documents (art. 4 pt 2 of the Copyright Act), anonymised at the source. SAOS service terms and database rights unverified. The corpus is not redistributed."
terms_url = "https://www.saos.org.pl/"
terms_checked_at = "2026-09-26"
attribution = "Źródło: SAOS (saos.org.pl) oraz portal orzeczeń sądu wskazany w original_url"
known_gaps = [
  "Coverage and freshness of SAOS not measured; the default sync fetches only a small topical sample.",
  "Source data errors exist (e.g. saos:31345 has judgment date 3013-12-04); such dates are nulled and flagged.",
  "Finality (prawomocność) unknown.",
  "Text comes from SAOS, not directly from the court portal; differences are possible.",
]

[sources.saos.defaults]
max_total = 30
queries = [
  { all = '"odstąpienia od umowy zawartej na odległość"', courtType = "COMMON", judgmentDateFrom = "2016-01-01" },
  { all = '"niezgodność towaru z umową"', keywords = "sprzedaż konsumencka", courtType = "COMMON", judgmentDateFrom = "2016-01-01" },
  { all = '"wezwanie do zapłaty" "odsetki ustawowe za opóźnienie"', keywords = "odsetki", courtType = "COMMON", judgmentDateFrom = "2016-01-01" },
]

[sources.cellar]
name = "Cellar — Publications Office of the EU (EUR-Lex)"
publisher = "Publications Office of the European Union – Cellar"
base_url = "https://publications.europa.eu/resource/celex"
hosts = ["publications.europa.eu"]
rate_per_s = 1.0
kinds = ["eu_act"]
id_prefix = "celex:"
maturity = "beta"
terms = "Reuse permitted with attribution per the EUR-Lex reuse notice (Commission Decision 2011/833/EU); not legally verified."
terms_url = "https://eur-lex.europa.eu/content/help/data-reuse/reuse-contents-eurlex-details.html"
terms_checked_at = "2026-09-26"
attribution = "© European Union, https://eur-lex.europa.eu"
known_gaps = [
  "Original Official Journal text, not consolidated versions.",
  "Recitals and annexes are not stored as provisions.",
  "The EUR-Lex website serves a bot challenge (202); it is not used or bypassed.",
  "Older acts (e.g. pre-2004 directives) may have no Polish XHTML manifestation in Cellar (404); PDF/Formex are not parsed yet.",
  "Full-text search over Cellar (SPARQL) is too slow for interactive use; live lookup works by identifier (CELEX, 'dyrektywa 2011/83/UE', 'RODO').",
]

[sources.cellar.defaults]
celex = ["32011L0083"]

[sources.cellar.aliases]
"dyrektywa 2011/83" = "celex:32011L0083"
"dyrektywy 2011/83" = "celex:32011L0083"
"2011/83/ue" = "celex:32011L0083"
"rodo" = "celex:32016R0679"
"gdpr" = "celex:32016R0679"

