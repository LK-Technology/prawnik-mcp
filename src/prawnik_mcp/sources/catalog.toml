terms = "Judgments are official documents (art. 4 pt 2 of the Copyright Act), anonymised at the source. SAOS service terms and database rights unverified. The corpus is not redistributed."
terms_url = "https://www.saos.org.pl/"
terms_checked_at = "2026-09-26"
attribution = "Źródło: SAOS (saos.org.pl) oraz portal orzeczeń sądu wskazany w original_url"
known_gaps = [
  "Coverage and freshness of SAOS not measured; the default sync fetches only a small topical sample.",
  "Source data errors exist (e.g. saos:31345 has judgment date 3013-12-04); such dates are nulled and flagged.",
  "Finality (prawomocność) unknown.",
  "Text comes from SAOS, not directly from the court portal; differences are possible.",
]

