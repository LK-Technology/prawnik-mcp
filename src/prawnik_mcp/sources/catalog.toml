#
# maturity: stable | beta | experimental | research (not implemented; listed so users know the gap)
# rate_per_s: maximum request rate per host we allow ourselves (polite default, never above source limits)
# id_prefix: prefix of document ids produced by the connector (used to attribute stored records to a source)

