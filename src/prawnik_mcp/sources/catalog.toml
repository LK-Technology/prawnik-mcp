terms = "NSA notice on the search form (read 2026-09-28): the online database serves informational and educational purposes only and has no official-collection status; judgments are anonymised under data-protection law. No reuse licence or terms of service found on the pages read (unverified). robots.txt disallows /cbo/search and /cbo/find for all user agents (/doc/ allowed) and bans GPTBot and MSNbot entirely; the connector follows it. Continuous traffic at ~2 req/s led to a full IP ban (403) per mcp-nsa; 0.5 req/s ran clean. Judgments are official documents (art. 4 pt 2 of the Copyright Act); database rights not legally verified. The corpus is not redistributed."
terms_url = "https://orzeczenia.nsa.gov.pl/cbo/query"
terms_checked_at = "2026-09-28"
attribution = "Źródło: Centralna Baza Orzeczeń Sądów Administracyjnych (orzeczenia.nsa.gov.pl) – baza informacyjna, nie zbiór urzędowy"
known_gaps = [
  "robots.txt disallows /cbo/search and /cbo/find, so there is no live search and no bulk sync: only single judgments by id (cbosa:<10 hex>, /doc/{HEX}) are fetched. Ids come from the user, from related-judgment links on stored pages, or from defaults.doc_ids.",
  "Not an official collection: text and metadata are CBOSA's informational, anonymised version.",
  "HTML scraping at <= 0.5 req/s process-wide; a 403 stops the run and pauses all CBOSA requests for 1 h.",
  "Finality (prawomocność) is CBOSA's status at fetch time (metadata.finality_as_of) and can change later.",
  "CBOSA's answer for a non-existent /doc/ id was not observed; such pages are reported as source_unavailable and never stored as judgments.",
  "Legal bases (Powołane przepisy) are kept as text plus ISAP links; they are not resolved to ELI documents.",
]

