]

[sources.cellar]
name = "Cellar — Publications Office of the EU (EUR-Lex): acts and CJEU case law"
publisher = "Publications Office of the European Union – Cellar"
base_url = "https://publications.europa.eu/resource/celex"
hosts = ["publications.europa.eu"]
rate_per_s = 1.0
kinds = ["eu_act", "eu_judgment"]
id_prefix = "celex:"
maturity = "beta"
terms = "Reuse permitted with attribution per the EUR-Lex reuse notice (Commission Decision 2011/833/EU); not legally verified."
terms_url = "https://eur-lex.europa.eu/content/help/data-reuse/reuse-contents-eurlex-details.html"
terms_checked_at = "2026-09-26"
attribution = "© European Union, https://eur-lex.europa.eu"
known_gaps = [
  "Both the Official Journal text and the latest consolidated version (Cellar CELEX 0YYYY…-YYYYMMDD) are stored; EU consolidated versions are documentation only — the OJ texts are legally binding.",
  "Only the latest consolidated version is fetched; earlier consolidations are listed (consolidated_versions_available) but not stored.",
  "Recitals and annexes are not stored as provisions.",
  "The EUR-Lex website serves a bot challenge (202); it is not used or bypassed.",
  "Older acts (e.g. pre-2004 directives) may have no Polish XHTML manifestation in Cellar (404); PDF/Formex are not parsed yet.",
  "Acts are looked up by identifier only (CELEX, 'dyrektywa 2011/83/UE', 'RODO'); there is no topic search over acts.",
  "CJEU case law (Court of Justice, General Court; CELEX sector 6): judgments (CJ, TJ), orders (CO, TO) and Advocate General opinions (CC, flagged advocate_general_opinion_not_a_ruling) are stored as records celex:6YYYYTTNNNN with the Polish text (XHTML, else legacy HTML). Notices in the OJ (CN, CA), summaries, and the Civil Service Tribunal pre-2016 are only reachable by explicit CELEX/case number.",
  "CJEU lookup works by case number (C-260/18, T-123/20, optional PPU/P suffix), CELEX (62018CJ0260) and ECLI. Other search is a title-word search (party names, subject, keywords, ANDed, word prefixes, newest first) that runs only when kinds include eu_judgment: Cellar has no full-text index of the rulings' reasoning, so topic recall is limited to what the titles and keywords say. A judgment in a joined-case group carries the CELEX of the first case only; other case numbers are found through the group's identifier.",
  "When the Polish text is missing (some orders, General Court judgments), the English then French text is stored and flagged language_fallback:<lang>; if no variant exists the document is not stored. Legacy HTML is flagged legacy_html_format. Cellar texts are documentary; the authentic publication is the European Court Reports / curia.europa.eu.",
  "Cited legislation and cases come from Cellar metadata (cdm:work_cites_work, cdm:case-law_interpretes_resource_legal) and may be incomplete; the citation graph does not use them yet. General Court rulings are flagged appeal_status_not_checked; later overruling or reinterpretation is not tracked.",
]

