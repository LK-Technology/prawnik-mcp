# Source catalog: one entry per legal data source.
#
# maturity: stable | beta | experimental | research (not implemented; listed so users know the gap)
# rate_per_s: maximum request rate per host we allow ourselves (polite default, never above source limits)
# id_prefix: prefix of document ids produced by the connector (used to attribute stored records to a source)

[sources.eli]
name = "ELI API — Dziennik Ustaw (Chancellery of the Sejm)"
publisher = "Kancelaria Sejmu RP – API ELI (Dziennik Ustaw)"
base_url = "https://api.sejm.gov.pl/eli"
hosts = ["api.sejm.gov.pl"]
rate_per_s = 1.0
kinds = ["statute"]
id_prefix = "eli:"
maturity = "beta"
terms = "Legal acts are not subject to copyright (art. 4 pt 2 of the Polish Copyright Act). No separate API terms found — unverified."
terms_url = "https://api.sejm.gov.pl/eli_pl.html"
terms_checked_at = "2026-09-26"
attribution = "Źródło: Dziennik Ustaw RP, API ELI Kancelarii Sejmu (api.sejm.gov.pl)"
known_gaps = [
  "Only the latest consolidated text (TJ) per act; no history of wordings (valid_from/valid_to not set).",
  "A TJ may include amendments entering into force after its state-of-law date (pending_changes, tracked per act, not per article).",
  "Transitional provisions not included in the TJ are quoted in excluded_provisions.",
  "Text extracted from PDF: superscripts restored heuristically; occasional spacing artefacts inside words.",
]

[sources.eli.defaults]
acts = { "DU/1964/93" = "Kodeks cywilny", "DU/2014/827" = "ustawa o prawach konsumenta" }

[sources.eli.aliases]
"kc" = "eli:DU/1964/93"
"k.c." = "eli:DU/1964/93"
"kodeks cywilny" = "eli:DU/1964/93"
"kodeksu cywilnego" = "eli:DU/1964/93"
"upk" = "eli:DU/2014/827"
"u.p.k." = "eli:DU/2014/827"
"ustawa o prawach konsumenta" = "eli:DU/2014/827"
"ustawy o prawach konsumenta" = "eli:DU/2014/827"
"prawach konsumenta" = "eli:DU/2014/827"

[sources.saos]
name = "SAOS — court judgments (ICM, University of Warsaw)"
publisher = "SAOS – System Analizy Orzeczeń Sądowych (ICM UW); judgments come from court portals"
base_url = "https://www.saos.org.pl/api"
hosts = ["www.saos.org.pl"]
rate_per_s = 1.0
kinds = ["judgment"]
id_prefix = "saos:"
maturity = "beta"
terms = "Judgments are official documents (art. 4 pt 2 of the Copyright Act), anonymised at the source. SAOS service terms and database rights unverified. The corpus is not redistributed."
terms_url = "https://www.saos.org.pl/"
terms_checked_at = "2026-09-26"
attribution = "Źródło: SAOS (saos.org.pl) oraz portal orzeczeń sądu wskazany w original_url"
known_gaps = [
  "Coverage and freshness of SAOS not measured; the default sync fetches only a small topical sample.",
  "Source data errors exist (e.g. saos:31345 has judgment date 3013-12-04); such dates are nulled and flagged.",
  "Finality (prawomocność) unknown.",
  "Text comes from SAOS, not directly from the court portal; differences are possible.",
]

[sources.saos.defaults]
max_total = 30
queries = [
  { all = '"odstąpienia od umowy zawartej na odległość"', courtType = "COMMON", judgmentDateFrom = "2016-01-01" },
  { all = '"niezgodność towaru z umową"', keywords = "sprzedaż konsumencka", courtType = "COMMON", judgmentDateFrom = "2016-01-01" },
  { all = '"wezwanie do zapłaty" "odsetki ustawowe za opóźnienie"', keywords = "odsetki", courtType = "COMMON", judgmentDateFrom = "2016-01-01" },
]

[sources.cellar]
name = "Cellar — Publications Office of the EU (EUR-Lex)"
publisher = "Publications Office of the European Union – Cellar"
base_url = "https://publications.europa.eu/resource/celex"
hosts = ["publications.europa.eu"]
rate_per_s = 1.0
kinds = ["eu_act"]
id_prefix = "celex:"
maturity = "beta"
terms = "Reuse permitted with attribution per the EUR-Lex reuse notice (Commission Decision 2011/833/EU); not legally verified."
terms_url = "https://eur-lex.europa.eu/content/help/data-reuse/reuse-contents-eurlex-details.html"
terms_checked_at = "2026-09-26"
attribution = "© European Union, https://eur-lex.europa.eu"
known_gaps = [
  "Original Official Journal text, not consolidated versions.",
  "Recitals and annexes are not stored as provisions.",
  "The EUR-Lex website serves a bot challenge (202); it is not used or bypassed.",
  "Older acts (e.g. pre-2004 directives) may have no Polish XHTML manifestation in Cellar (404); PDF/Formex are not parsed yet.",
  "Full-text search over Cellar (SPARQL) is too slow for interactive use; live lookup works by identifier (CELEX, 'dyrektywa 2011/83/UE', 'RODO').",
]

[sources.cellar.defaults]
celex = ["32011L0083"]

[sources.cellar.aliases]
"dyrektywa 2011/83" = "celex:32011L0083"
"dyrektywy 2011/83" = "celex:32011L0083"
"2011/83/ue" = "celex:32011L0083"
"rodo" = "celex:32016R0679"
"gdpr" = "celex:32016R0679"

[sources.eureka]
name = "EUREKA — tax interpretations (Ministry of Finance / KIS)"
publisher = "Ministerstwo Finansów – System Informacji Celno-Skarbowej EUREKA (interpretacje indywidualne: Dyrektor KIS)"
base_url = "https://eureka.mf.gov.pl/api/public/v1"
hosts = ["eureka.mf.gov.pl"]
rate_per_s = 0.5
kinds = ["tax_ruling"]
id_prefix = "eureka:"
maturity = "experimental"
terms = "No terms of use for EUREKA or its JSON API found; no robots.txt (the web app answers every path with its index page). The gov.pl page describing EUREKA carries the gov.pl footer licence (text: CC BY-SA 4.0) — whether it covers EUREKA documents is unverified. Interpretations are official documents published anonymised by the authority; copyright exclusion (art. 4 pt 2 of the Copyright Act) and database rights not legally verified. The corpus is not redistributed."
terms_url = "https://www.gov.pl/web/kas/system-informacji-celno-skarbowej-eureka"
terms_checked_at = "2026-09-28"
attribution = "Źródło: EUREKA – System Informacji Celno-Skarbowej, Ministerstwo Finansów (eureka.mf.gov.pl)"
known_gaps = [
  "Interpretations are not a source of law; an individual interpretation protects only its applicant (art. 14k–14nb Tax Ordinance).",
  "Live search matches signature, thesis and metadata (searchInContent=false); it is not a full-text search of the documents.",
  "Default search and sample cover category 1 (individual interpretations) only; other EUREKA categories are fetched on request and flagged not_an_individual_interpretation.",
  "Upstream pagination sorted by issue date alone is unstable (a live probe repeated one id and skipped another); ID_INFORMACJI is added as a tie-breaker and bulk sync de-duplicates ids and warns when fewer ids than totalHits were seen.",
  "Dictionary fields (AUTOR, PRZEPISY, ZAGADNIENIA, SLOWA_KLUCZOWE) are kept as raw numeric ids; only STATUS_INFORMACJI 27 = 'Aktualna' was observed. The issuing authority is inferred from the KIS signature prefix (0111–0115-KD…), otherwise flagged issuing_authority_unresolved.",
  "Later changes of an interpretation (zmiana, uchylenie, court annulment) are not linked; a stored document can become outdated.",
  "Attachments are not parsed (flagged attachments_not_parsed). Issue date comes as a UTC timestamp and is converted to the Europe/Warsaw date; inclusivity of the DT_WYD_end filter is unverified.",
]

[sources.eureka.defaults]
max_total = 10
queries = [
  { query = "ulga termomodernizacyjna", category_ids = [1] },
  { query = "najem prywatny ryczałt", category_ids = [1] },
]

[sources.kio]
name = "KIO — National Appeal Chamber (public procurement)"
publisher = "Krajowa Izba Odwoławcza; portal orzeczeń Urzędu Zamówień Publicznych"
base_url = "https://orzeczenia.uzp.gov.pl"
hosts = ["orzeczenia.uzp.gov.pl"]
rate_per_s = 1.0
kinds = ["judgment"]
id_prefix = "kio:"
maturity = "experimental"
terms = "No terms of use or reuse licence found on the portal (read 2026-09-28: home page and /Home/Cookies; no robots.txt). Rulings are official documents (art. 4 pt 2 of the Copyright Act) — unverified legal reading; database rights unverified. Rulings name panel members and companies (natural-person traders appear by initials). The corpus is not redistributed."
terms_url = "https://orzeczenia.uzp.gov.pl/Home/Cookies"
terms_checked_at = "2026-09-28"
attribution = "Źródło: Krajowa Izba Odwoławcza – wyszukiwarka orzeczeń UZP (orzeczenia.uzp.gov.pl)"
known_gaps = [
  "Scraped HTML portal without an API or bulk export; UZP moved all endpoints in 2026-07 — layout changes raise errors instead of returning empty results.",
  "Only a sample is stored; each ruling costs 2 requests (Details + ContentHtml).",
  "Some older records have no issue date; future/implausible dates from the portal are nulled and flagged.",
  "Finality unknown (complaint to Sąd Okręgowy w Warszawie – Sąd Zamówień Publicznych).",
  "The same ruling can also exist in SAOS (courtType NATIONAL_APPEAL_CHAMBER); case-number lookup may then be ambiguous.",
  "PDF versions are linked, not fetched.",
]

[sources.kio.defaults]
max_total = 10
queries = [
  { query = "rażąco niska cena", since = "2025-01-01", sort = "date_desc" },
]

[sources.uodo]
name = "UODO — decisions of the President of the Personal Data Protection Office"
publisher = "Prezes Urzędu Ochrony Danych Osobowych; Portal Orzeczeń UODO"
base_url = "https://orzeczenia.uodo.gov.pl"
hosts = ["orzeczenia.uodo.gov.pl"]
rate_per_s = 1.0
kinds = ["decision"]
id_prefix = "uodo:"
maturity = "experimental"
terms = "No terms of use or reuse licence found on the portal (read 2026-09-28: page footer '© UODO 2018 - 2025 Wszelkie prawa zastrzeżone'; privacy policy on uodo.gov.pl not read; no robots.txt). Decisions are official documents (art. 4 pt 2 of the Copyright Act), published anonymised by UODO — unverified legal reading; scope of the 'all rights reserved' notice unverified. The corpus is not redistributed."
terms_url = "https://orzeczenia.uodo.gov.pl/"
terms_checked_at = "2026-09-28"
attribution = "Źródło: Prezes UODO – Portal Orzeczeń UODO (orzeczenia.uodo.gov.pl)"
known_gaps = [
  "Uses the portal's undocumented route-data endpoints (search.data, content.data; turbo-stream); they may change with any portal release.",
  "Only GDPR-era decisions (dcr=rodo) are searched; pre-2018 (GIODO) coverage not assessed.",
  "Bulk since/until filter the publication date; live date_from/date_to are applied locally to the returned page.",
  "An unknown URN returns HTTP 200 with an empty document; treated as not found.",
  "A decision can carry several case numbers (e.g. re-decisions); case-number lookup may be ambiguous.",
  "Subject and keywords come only from search listings; court challenges are kept as URN references, not fetched.",
]

[sources.uodo.defaults]
max_total = 10
queries = [
  { query = "sklep internetowy" },
]

[sources.cbosa]
name = "CBOSA — administrative courts (NSA/WSA)"
publisher = "Naczelny Sąd Administracyjny – Centralna Baza Orzeczeń Sądów Administracyjnych"
base_url = "https://orzeczenia.nsa.gov.pl"
hosts = ["orzeczenia.nsa.gov.pl"]
rate_per_s = 0.5
kinds = ["judgment"]
id_prefix = "cbosa:"
maturity = "experimental"
terms = "NSA notice on the search form (read 2026-09-28): the online database serves informational and educational purposes only and has no official-collection status; judgments are anonymised under data-protection law. No reuse licence or terms of service found on the pages read (unverified). robots.txt disallows /cbo/search and /cbo/find for all user agents (/doc/ allowed) and bans GPTBot and MSNbot entirely; the connector follows it. Continuous traffic at ~2 req/s led to a full IP ban (403) per mcp-nsa; 0.5 req/s ran clean. Judgments are official documents (art. 4 pt 2 of the Copyright Act); database rights not legally verified. The corpus is not redistributed."
terms_url = "https://orzeczenia.nsa.gov.pl/cbo/query"
terms_checked_at = "2026-09-28"
attribution = "Źródło: Centralna Baza Orzeczeń Sądów Administracyjnych (orzeczenia.nsa.gov.pl) – baza informacyjna, nie zbiór urzędowy"
known_gaps = [
  "robots.txt disallows /cbo/search and /cbo/find, so there is no live search and no bulk sync: only single judgments by id (cbosa:<10 hex>, /doc/{HEX}) are fetched. Ids come from the user, from related-judgment links on stored pages, or from defaults.doc_ids.",
  "Not an official collection: text and metadata are CBOSA's informational, anonymised version.",
  "HTML scraping at <= 0.5 req/s process-wide; a 403 stops the run and pauses all CBOSA requests for 1 h.",
  "Finality (prawomocność) is CBOSA's status at fetch time (metadata.finality_as_of) and can change later.",
  "CBOSA's answer for a non-existent /doc/ id was not observed; such pages are reported as source_unavailable and never stored as judgments.",
  "Legal bases (Powołane przepisy) are kept as text plus ISAP links; they are not resolved to ELI documents.",
]

[sources.cbosa.defaults]
# sync_defaults fetches only these judgments, via /doc/ (robots-allowed). Samples recorded 2026-09-28.
doc_ids = ["9FF3766DA4", "3BB1F6C423", "4DC5BD4680"]

