[sources.sn]
name = "SN — Supreme Court rulings (sn.pl ruling database)"
publisher = "Sąd Najwyższy; Baza orzeczeń Sądu Najwyższego (www.sn.pl)"
base_url = "https://www.sn.pl/pl/wyszukiwarka-orzeczen"
hosts = ["www.sn.pl"]
rate_per_s = 0.5
kinds = ["judgment"]
id_prefix = "sn:"
maturity = "experimental"
terms = "No terms of use or licence for the ruling database found (read 2026-09-28: the database page, /pl/informacje/ponowne-wykorzystywanie-informacji-publicznych and robots.txt). The reuse page only summarises the 2021 Open Data Act: SN 'may' set reuse conditions, none are set for the database, reuse is free of charge; it also says a reuse request is needed for information published outside BIP without stated conditions — whether that applies to the database is unverified. robots.txt (Joomla default) disallows system paths only (/api/, /components/, /modules/, /plugins/ …); the connector uses none of them. Rulings are official documents (art. 4 pt 2 of the Copyright Act), published anonymised by SN — unverified legal reading; database rights unverified. Judges, clerks and prosecutors are named. The corpus is not redistributed."
terms_url = "https://www.sn.pl/pl/informacje/ponowne-wykorzystywanie-informacji-publicznych"
terms_checked_at = "2026-09-28"
attribution = "Źródło: Sąd Najwyższy – Baza orzeczeń (www.sn.pl)"
known_gaps = [
  "Uses the undocumented com_ajax proxy behind the sn.pl search page (/pl/index.php?option=com_ajax&plugin=snproxy); it may change with any site release — layout changes raise errors instead of returning empty results. The site is behind an Imperva WAF; challenges are reported as unavailable, never bypassed.",
  "Search returns metadata only (case number, date, form): no snippet, no total count, newest first rather than by relevance. Live phrase search runs only when asked for (filters.court_type = SUPREME); case numbers are always looked up.",
  "Upstream case-number search is a case-insensitive substring match ('II KK 45/24' also returns 'III KK 45/24'); hits are filtered to the exact case number locally.",
  "Document ids are the upstream search-index ids (e.g. 311jSJcBZvGrB8P_pKA7); whether they survive an index rebuild is unknown.",
  "Text is an HTML rendering of the PDF: lines are re-ordered by position and running headers dropped; line-end hyphenation and letter-spaced words ('o d d a l i ł') are kept. No separate thesis field (older OSN-format texts carry the thesis inline).",
  "Rulings are often published before their reasons (flagged uzasadnienie_not_in_text); re-fetch later with force. Dissent fields in the metadata can be empty although the text records a dissent.",
  "Only a sample is stored; each ruling costs 2 requests (details + HTML). PDF versions are linked, not fetched.",
  "Overlap with SAOS (courtType SUPREME, up to 2016; sn.pl has rulings back to at least 1999): the same ruling can be stored as saos:<id> and sn:<id>, so case-number lookup may be ambiguous.",
  "Finality is not set: most SN rulings are final when issued, but e.g. first-instance disciplinary rulings can be appealed within SN.",
]

[sources.sn.defaults]
max_total = 6
queries = [
  { form = "uchwała SN", chamber = "Izba Cywilna", since = "2025-01-01" },
  { query = "przedawnienie roszczeń konsumenta", since = "2025-01-01" },
]

[sources.tk]
name = "TK — Constitutional Tribunal (rulings: trybunal.gov.pl, IPO)"
publisher = "Trybunał Konstytucyjny; serwis internetowy trybunal.gov.pl (Kancelaria Trybunału Konstytucyjnego)"
base_url = "https://trybunal.gov.pl"
hosts = ["trybunal.gov.pl", "ipo.trybunal.gov.pl"]
rate_per_s = 0.5
kinds = ["judgment"]
id_prefix = "tk:"
maturity = "experimental"
terms = "Reuse conditions of the Chancellery of the Tribunal (read 2026-09-28, /informacja-publiczna-media/ponowne-wykorzystywanie; basis: art. 14–16 of the Act of 11 August 2021 on open data and the reuse of public sector information): (1) state the source, the time the information was created and obtained, and the author if known; (2) state that the information was processed, if it was; (3) the Tribunal and its Chancellery are not liable for processed information. robots.txt allows everything except /typo3/ and /typo3conf/. IPO (ipo.trybunal.gov.pl, the Tribunal's portal of full texts; read 2026-09-28): robots.txt answers 404 (no restrictions), the portal shows no terms of its own (the user manual has none either), so the conditions above of the same publisher are applied; only the public server-rendered case pages are read, no search form, CAPTCHA or protection is involved. Rulings are official documents (art. 4 pt 2 of the Copyright Act) — unverified legal reading; database rights unverified. Rulings name judges and the court clerk; parties who are natural persons appear by initials. The corpus is not redistributed."
terms_url = "https://trybunal.gov.pl/informacja-publiczna-media/ponowne-wykorzystywanie"
terms_checked_at = "2026-09-28"
attribution = "Źródło: Trybunał Konstytucyjny – trybunal.gov.pl (orzeczenia wraz z uzasadnieniami; informacja przetworzona: HTML → tekst, bez zdań odrębnych)"
known_gaps = [
  "Full text with reasoning comes from IPO (ipo.trybunal.gov.pl) when the ruling is found there (case page fetched by case number, tab matched by kind and date); otherwise, or when IPO fails, only the operative part from trybunal.gov.pl is stored and the record is flagged reasoning_not_included / ipo_full_text_unavailable. OTK ZU (otkzu.trybunal.gov.pl) is not used.",
  "IPO answers HTTP/2 only (an HTTP/1.1 request is never answered), so the client needs the h2 package (httpx[http2]).",
  "Dissenting opinions (zdania odrębne) are on IPO after the ruling text; they are kept in the IPO snapshot but not in the stored text. Only their authors' names (from the ruling article) are in metadata.",
  "Scraped TYPO3 site without an API or bulk export; layout changes raise errors instead of returning empty results.",
  "Only a sample is stored; each ruling costs 2 requests (article + IPO case page, up to 1 MB) (plus 1 per listing page of 12, per search page of 10, or 1–2 per case-number lookup).",
  "Phrase search is the site's Solr index of published articles (operative parts and titles), relevance-ordered; recall is low and hits usually carry no case number or date until fetched; the reasoning is not searchable remotely.",
  "Preliminary-review rulings (Ts, Tw; OTK ZU series B) are not on the site; their case numbers answer 404.",
  "Older articles contain encoding damage made by the source (e.g. 'Sšdu' for 'Sądu', lost 'ś' and dashes); the text is stored as-is and flagged source_encoding_artifacts; names in metadata are repaired.",
  "No OTK ZU or Dziennik Ustaw publication reference on the site; `publication` is filled only if the page text quotes an OTK ZU reference.",
  "Ids use the site's article slug (tk:wyroki/<slug>, tk:postanowienia/<slug>); the tt_news uid is kept in metadata when known.",
  "Overlap with SAOS (courtType CONSTITUTIONAL_TRIBUNAL, rulings up to 2015): the same ruling can be stored as saos:<id> and tk:<section>/<slug>; case-number lookup may then be ambiguous.",
]

[sources.tk.defaults]
max_total = 6
queries = [
  { listing = "wyroki" },
]

