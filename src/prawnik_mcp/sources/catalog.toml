known_gaps = [
  "robots.txt disallows /cbo/search and /cbo/find, so there is no live search and no bulk sync: only single judgments by id (cbosa:<10 hex>, /doc/{HEX}) are fetched. Ids come from the user, from related-judgment links on stored pages, or from defaults.doc_ids.",
  "Not an official collection: text and metadata are CBOSA's informational, anonymised version.",
  "HTML scraping at <= 0.5 req/s process-wide; a 403 stops the run and pauses all CBOSA requests for 1 h.",
  "Finality (prawomocność) is CBOSA's status at fetch time (metadata.finality_as_of) and can change later.",
  "CBOSA's answer for a non-existent /doc/ id was not observed; such pages are reported as source_unavailable and never stored as judgments.",
