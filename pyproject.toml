[project]
name = "prawnik-mcp"
version = "0.2.0.dev0"
description = "MCP server for Polish and EU law: sourced search, exact provisions with version provenance, citation checks and draft letters"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{ name = "LK Technology" }]
keywords = ["mcp", "model-context-protocol", "law", "legal", "poland", "polish-law", "eli", "saos", "eur-lex", "citations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Legal Industry",
    "Natural Language :: Polish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "pypdf>=6.19,<7",
    "python-docx>=1.2,<2",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=9", "reportlab>=4", "ruff>=0.6"]

[project.scripts]
prawnik-mcp = "prawnik_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/LK-Technology/prawnik-mcp"
Company = "https://lktech.pl"
Issues = "https://github.com/LK-Technology/prawnik-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prawnik_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/prawnik_mcp",
    "tests",
    "evals",
    "docs",
    "README*.md",
    "LICENSE",
    "NOTICE",
    "licenses",
    "CHANGELOG.md",
    "pyproject.toml",
]
exclude = ["**/.DS_Store", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["online: hits real public sources (skipped unless PRAWNIK_ONLINE=1)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]  # UP042: keep (str, Enum) — str() output is part of the contract
